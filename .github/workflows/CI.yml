name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  # Lockfiles are standardized on npm 11 (latest stable major).
  # Pinning npm keeps `npm ci` strict-sync checks identical to local dev.
  NPM_VERSION: "11"

jobs:
  security-scan:
    name: Security — Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend — typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Pin npm version
        run: npm i -g npm@${{ env.NPM_VERSION }}

      # shared + frontend (+ admin) are npm workspaces — the lockfile lives at
      # the repo root, so install must run there (npm ci in frontend/ alone
      # would fail with "no package-lock.json").
      - name: Install workspace dependencies
        run: npm ci

      - name: Build shared types package
        run: cd shared && npx tsc

      - name: Create frontend .env from example
        working-directory: frontend
        run: cp .env.example .env

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Production build (tsc + vite)
        working-directory: frontend
        run: npm run build

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Lint
        working-directory: frontend
        run: npx eslint . --ext ts,tsx --max-warnings 5

  backend:
    name: Backend — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Pin npm version
        run: npm i -g npm@${{ env.NPM_VERSION }}

      - name: Build shared types package
        run: |
          cd ../shared
          npm install
          npx tsc --noEmit
          npx tsc

      - name: Install dependencies
        run: npm ci

      - name: Create .env from example
        run: cp .env.example .env

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Export test (ExcelJS workbook)
        run: npx tsx src/tests/actionItemsExport.test.ts
